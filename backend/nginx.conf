events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Cabeceras de seguridad unificadas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    Permissions-Policy "geolocation=(self), microphone=(), camera=(self)"

    # CSP consolidada (una sola línea)
    add_header Content-Security-Policy "default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https://unpkg.com https://images.unsplash.com https://ui-avatars.com https://*.basemaps.cartocdn.com;
    connect-src 'self' https://unpkg.com;" always;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ==========================================
    # 1. REDIRECCIÓN AUTOMÁTICA (HTTP -> HTTPS)
    # ==========================================
    server {
        listen 80;
        server_name pawtrack.me www.pawtrack.me;

        # Cualquier petición al puerto 80 se va directo al 443
        return 301 https://$host$request_uri;
    }

    # ==========================================
    # 2. SERVIDOR PRINCIPAL SEGURO (HTTPS)
    # ==========================================
    server {
        listen 443 ssl;
        server_name pawtrack.me www.pawtrack.me;

        # Certificados de Let's Encrypt (Mapeados desde tu docker-compose)
        ssl_certificate /etc/letsencrypt/live/pawtrack.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pawtrack.me/privkey.pem;

        # Optimizaciones estándar de seguridad SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;


        # LA GUILLOTINA DE SEGURIDAD
        # (Comillas agregadas para arreglar el bug visual de Nano)
        location ~ "^/(admin|__debug__|swagger)" {
            deny all;
            return 403;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            return 404;
        }

        # FRONTEND (Angular 17 SPA)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # BACKEND (Django API y Admin)
        location ~ ^/api {
           include proxy_params;
           proxy_pass http://backend:8000;
           # No repitas proxy_set_header aquí, ya están en proxy_params
        }

        # WEBSOCKETS (Django Channels)
        location /ws/ {
           include proxy_params;
           proxy_pass http://backend:8000;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection "upgrade";
           # Host y X-Real-IP ya vienen de proxy_params
        }

        # ARCHIVOS ESTÁTICOS Y MULTIMEDIA
        location /static/ {
            alias /opt/pawtrack/staticfiles/;
        }

        location /media/ {
            alias /opt/pawtrack/media/;
        }
    }
}