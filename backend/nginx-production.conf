events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;

    # Cabeceras de seguridad unificadas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;

    # CSP consolidada (una sola línea)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://unpkg.com https://images.unsplash.com https://ui-avatars.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://unpkg.com https://nominatim.openstreetmap.org;" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ==========================================

    # 1. REDIRECCIÓN AUTOMÁTICA (HTTP -> HTTPS)

    # ==========================================

    server {
        listen 80;
        # Atrapas a la IP y a ambos dominios en una sola línea
        server_name 13.59.118.210 pawtrack.me www.pawtrack.me;
        # Los fuerzas a TODOS a ir al dominio seguro oficial (sin usar $host)
        return 301 https://pawtrack.me$request_uri;

    }

    # ==========================================
    # 2. SERVIDOR PRINCIPAL SEGURO (HTTPS)
    # ==========================================

    server {

        listen 443 ssl;
        server_name pawtrack.me www.pawtrack.me;
        # Reject oversized uploads before Django parses the request body.
        client_max_body_size 10m;
        # Certificados de Let's Encrypt (Mapeados desde tu docker-compose)
        ssl_certificate /etc/letsencrypt/live/pawtrack.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pawtrack.me/privkey.pem;

        # Optimizaciones estándar de seguridad SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # --- BLINDAJE DE SEGURIDAD (HSTS y OCSP Stapling) ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/pawtrack.me/chain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # LA GUILLOTINA DE SEGURIDAD
        # (Comillas agregadas para arreglar el bug visual de Nano)
        location ~ "^/(__debug__|swagger)" {
            deny all;
            return 403;
        }

        location /admin{
            deny all;
            return 404;
        }

        location ^~ /api/auth/login/ {
            limit_req zone=login_limit burst=10 nodelay;
            include proxy_params;
            proxy_pass http://backend:8000;
        }

        location ~ ^/(api|portal-gestion-pawtrack-7676){
            include proxy_params;
            proxy_pass http://backend:8000;
        }



        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            return 404;
        }

        # FRONTEND (Angular 17 SPA)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }


        # WEBSOCKETS (Django Channels)
        location /ws/ {
           include proxy_params;
           proxy_pass http://backend:8000;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection "upgrade";
           # Host y X-Real-IP ya vienen de proxy_params
        }

        # ARCHIVOS ESTÁTICOS Y MULTIMEDIA
        location /static/ {
            alias /opt/pawtrack/staticfiles/;
        }

        location /media/ {
            alias /opt/pawtrack/media/;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name 13.59.118.210;
        ssl_reject_handshake on;
    }

}