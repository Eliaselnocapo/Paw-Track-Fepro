services:
  # Servicio de la Base de Datos
  db:
    image: postgis/postgis:15-3.3-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # PUERTOS ELIMINADOS POR SEGURIDAD

  # Servicio de la Aplicación Django
  backend:
    build: .
    env_file:
      - .env
    command: daphne -b 0.0.0.0 -p 8000 pawtrack.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # PUERTOS ELIMINADOS POR SEGURIDAD - Todo el tráfico debe pasar por Nginx
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - REDIS_URL=redis://redis:6379/1
      # Opcional: radio máximo en metros entre el reporte y el punto de cierre
      # del rescate. Sin definir, el GPS de cierre queda solo como evidencia
      # (no bloquea el cierre por distancia).
      - RESCATE_CIERRE_RADIO_METROS=${RESCATE_CIERRE_RADIO_METROS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  celery-worker:
    build: .
    command: celery -A pawtrack worker -l info -Q dedup,celery 
    volumes:
      - .:/app
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  
  celery-beat:
    build: .
    command: celery -A pawtrack beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/logs:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/pawtrack/frontend/pawtrack-app/www:/usr/share/nginx/html:ro
      - ./staticfiles:/opt/pawtrack/staticfiles:ro
      - ./media:/opt/pawtrack/media:ro
    depends_on:
      - backend

volumes:
  postgres_data: