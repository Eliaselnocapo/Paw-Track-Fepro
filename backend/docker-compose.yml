services:
  # Servicio de la Base de Datos
  db:
    image: postgis/postgis:15-3.3-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # PUERTOS ELIMINADOS POR SEGURIDAD
      
  redis: 
    image: redis:7-alpine
    # PUERTOS ELIMINADOS POR SEGURIDAD
  
  # Servicio de la Aplicación Django
  backend:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 pawtrack.asgi:application
    volumes:
      - .:/app
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - REDIS_URL=redis://redis:6379/1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    # PUERTOS ELIMINADOS POR SEGURIDAD

  celery-worker:
    build: .
    command: celery -A pawtrack worker -l info
    volumes:
      - .:/app
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
  
  celery-beat:
    build: .
    command: celery -A pawtrack beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80" # EL ÚNICO PUERTO EXPUESTO AL MUNDO
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/pawtrack-app/www:/usr/share/nginx/html:ro
      - ./staticfiles:/opt/pawtrack/staticfiles:ro
      - ./media:/opt/pawtrack/media:ro
    depends_on:
      - backend    

volumes:
  postgres_data: