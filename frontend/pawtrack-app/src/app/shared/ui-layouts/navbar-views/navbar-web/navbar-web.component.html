<header
  class="fixed top-0 left-0 w-full z-50 bg-[#1138a3] border-b border-blue-800/40 shadow-lg h-16 flex items-center
         transition-transform duration-300 ease-in-out"
  [class.-translate-y-full]="isHidden"
>
<div class="max-w-[1280px] mx-auto px-2 md:px-1 w-full flex justify-between items-center">

    <div class="flex items-center gap-3 md:gap-14">

      <app-menu-toggle class="md:hidden"></app-menu-toggle>

      <!-- Logo / marca (pegado a la izquierda) -->
      <div class="flex items-center gap-2.5 cursor-pointer group shrink-0" routerLink="/home">
        <img src="assets/icon/pawtrack-logo.png" alt="PawTrack"
          class="w-9 h-9 md:w-10 md:h-10 object-contain group-hover:scale-105 transition-transform" />
        <span class="text-lg md:text-2xl font-bold text-white tracking-tight">PawTrack</span>
      </div>

      <!-- Links escritorio -->
      <nav class="hidden md:flex gap-3 h-16 items-center">

        <a routerLink="/home" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link">Inicio</a>

        <a routerLink="/mapa" routerLinkActive="nav-active" class="nav-link">Mapa General</a>

        <a routerLink="/dashboard/reporter" routerLinkActive="nav-active" class="nav-link">Reportes</a>

        <a routerLink="/dashboard/volunteer" routerLinkActive="nav-active" class="nav-link">Apoyo</a>
        <a routerLink="/patrocinadores" routerLinkActive="nav-active" class="nav-link">Refugios</a>
        
        @if ((usuario$ | async)?.is_staff) {
          <a routerLink="/moderacion" routerLinkActive="nav-active"
            class="nav-link flex items-center gap-1.5">
            Moderación
          </a>
        }
      </nav>
    </div>

    <div class="flex items-center gap-3 md:gap-6">

      @if (!isLoggedIn) {
        <a routerLink="/login"
          class="hidden md:block text-blue-100 hover:text-white transition-colors text-sm font-semibold cursor-pointer">
          Iniciar sesion
        </a>
      } @else {
        <app-campana-notificaciones></app-campana-notificaciones>

        <!-- Avatar escritorio -->
        <button routerLink="/profile"
          class="hidden md:flex w-10 h-10 bg-white items-center rounded-full justify-center overflow-hidden border-2 border-[#7DB7FF] hover:border-white hover:bg-blue-50 transition-colors focus:outline-none shadow-sm">
          @if (usuario$ | async; as u) {
            @if (fotoUrl(u)) {
              <img [src]="fotoUrl(u)" alt="" class="w-full h-full object-cover">
            } @else {
              <span class="text-[#2E5BD8] font-bold text-sm">{{ iniciales(u) }}</span>
            }
          } @else {
            <span class="material-symbols-outlined text-[#2E5BD8] text-[22px]">person</span>
          }
        </button>

        <!-- Avatar movil -->
        <button routerLink="/profile"
          class="flex md:hidden w-9 h-9 bg-white items-center rounded-full justify-center overflow-hidden border-2 border-[#7DB7FF] active:scale-95 transition-transform">
          @if (usuario$ | async; as u) {
            @if (fotoUrl(u)) {
              <img [src]="fotoUrl(u)" alt="" class="w-full h-full object-cover">
            } @else {
              <span class="text-[#2E5BD8] font-bold text-xs">{{ iniciales(u) }}</span>
            }
          } @else {
            <span class="material-symbols-outlined text-[#2E5BD8] text-[20px]">person</span>
          }
        </button>
      }

      <!-- Boton escritorio rojo -->
      <button
        class="hidden md:flex bg-red-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-red-700 transition-colors items-center gap-2 shadow-md shadow-red-900/20 active:scale-95"
        routerLink="/reports/create-report">
        <span class="material-symbols-outlined text-[18px]">e911_emergency</span>
        Reportar emergencia
      </button>

    </div>
  </div>
</header>
