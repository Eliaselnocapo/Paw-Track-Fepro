<header class="bg-blue-700 shadow-md w-full z-50 h-16 flex items-center transition-all duration-200">
  <div class="max-w-[1280px] mx-auto px-3 md:px-12 w-full flex justify-between items-center">

    <div class="flex items-center gap-3 md:gap-10">

      <app-menu-toggle class="md:hidden"></app-menu-toggle>

      <div class="flex items-center cursor-pointer" routerLink="/home">
        <span class="text-lg md:text-2xl font-bold text-white tracking-tight">
          PawTrack
        </span>
      </div>

      <nav class="hidden md:flex gap-6 h-16 items-center">
        <a routerLink="/home" routerLinkActive="border-b-2 border-white" class="text-white hover:text-white/80 transition-colors text-sm font-semibold h-full flex items-center px-1 border-b-2 border-transparent">
          Inicio
        </a>

        <a routerLink="/mapa" routerLinkActive="border-b-2 border-white" class="text-white hover:text-white/80 transition-colors text-sm font-semibold h-full flex items-center px-1 border-b-2 border-transparent">
          Mapa General
        </a>

        <a routerLink="/dashboard/reporter" routerLinkActive="border-b-2 border-white" class="text-white hover:text-white/80 transition-colors text-sm font-semibold h-full flex items-center px-1 border-b-2 border-transparent">
          Reportes
        </a>

        @if (isLoggedIn) {
          <a routerLink="/dashboard/volunteer" routerLinkActive="border-b-2 border-white" class="text-white hover:text-white/80 transition-colors text-sm font-semibold h-full flex items-center px-1 border-b-2 border-transparent">
            Apoyo
          </a>
          <a routerLink="/impacto" routerLinkActive="border-b-2 border-white" class="text-white hover:text-white/80 transition-colors text-sm font-semibold h-full flex items-center px-1 border-b-2 border-transparent">
            Impacto
          </a>
        } @else {
          <a routerLink="/ayuda" routerLinkActive="border-b-2 border-white" class="text-white hover:text-white/80 transition-colors text-sm font-semibold h-full flex items-center px-1 border-b-2 border-transparent">
            Asistir
          </a>
        }
      </nav>
    </div>

    <div class="flex items-center gap-2 md:gap-6">

      @if (!isLoggedIn) {
        <a routerLink="/login" class="hidden md:block text-white hover:text-white/80 transition-colors text-sm font-bold cursor-pointer">
          Iniciar Sesión
        </a>
      } @else {
        <button routerLink="/profile" class="hidden md:flex w-9 h-9 rounded-full overflow-hidden border-2 border-white hover:opacity-80 transition-opacity focus:outline-none bg-slate-200 items-center justify-center">
          <span class="text-slate-800 font-bold text-xs">US</span>
        </button>
      }

      <button class="flex md:hidden bg-white text-blue-700 px-2.5 py-1.5 rounded-lg font-bold hover:bg-slate-100 transition-colors items-center gap-1.5 shadow-sm active:scale-95" routerLink="/reports/create-report">
        <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">warning</span>
        <span class="flex flex-col text-[10px] leading-[11px] text-left">
          <span>Reportar</span>
          <span>Emergencia</span>
        </span>
      </button>

      <button class="hidden md:flex bg-white text-blue-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-100 transition-colors items-center gap-2 shadow-sm active:scale-95" routerLink="/reports/create-report">
        <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">warning</span>
        Reportar Emergencia
      </button>

    </div>
  </div>
</header>
