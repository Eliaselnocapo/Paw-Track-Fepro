<header class="bg-primary shadow-md w-full z-50 h-16 flex items-center transition-all duration-200">
  <div class="max-w-[1280px] mx-auto px-4 md:px-12 w-full flex justify-between items-center">

    <!-- Logo -->
    <div class="flex items-center gap-4 cursor-pointer">
      <span class="text-xl font-bold text-white font-headline-md tracking-tight">PawTrack</span>
    </div>

    <!-- Links de Navegación -->
    <nav class="hidden md:flex gap-8 h-full items-center">
      <a
        routerLink="/home"
        routerLinkActive="border-b-2 border-white text-white font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-white/80 hover:text-white transition-colors text-sm font-semibold h-full flex items-center border-b-2 border-transparent">Inicio</a>
      <!-- Ejemplo de link activo -->
      <a
        routerLink="/reports/create-report"
        routerLinkActive="border-b-2 border-white text-white font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-white/80 hover:text-white transition-colors text-sm font-semibold h-full flex items-center border-b-2 border-transparent">Casos</a>
      <a
        routerLink="/impact"
        routerLinkActive="border-b-2 border-white text-white font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-white/80 hover:text-white transition-colors text-sm font-semibold h-full flex items-center border-b-2 border-transparent">Impacto</a>
      <a
        routerLink="/profile"
        routerLinkActive="border-b-2 border-white text-white font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-white/80 hover:text-white transition-colors text-sm font-semibold h-full flex items-center border-b-2 border-transparent">
        Perfil
      </a>
    </nav>

    <!-- Botón de Acción -->
    <div class="flex items-center gap-4">
      <button class="bg-white text-primary px-4 py-2 rounded-lg text-sm font-bold hover:bg-surface-variant transition-colors flex items-center gap-2 shadow-sm active:scale-95">
        <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">warning</span>
        Reportar Emergencia
      </button>
    </div>

  </div>
</header>
