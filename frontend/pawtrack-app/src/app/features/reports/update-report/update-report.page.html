<ion-content [fullscreen]="true">
<div class="min-h-screen flex flex-col bg-[#f7f9ff] text-on-surface">

  <app-navbar-web></app-navbar-web>

  <main class="flex-1 w-full max-w-[1280px] mx-auto px-6 md:px-12 py-8">

    <section class="mb-6">
      <h1 class="text-3xl font-bold text-on-surface">
        Actualizar detalles del caso
      </h1>

      <span class="inline-block mt-2 bg-primary-container text-primary px-3 py-1 rounded text-xs font-bold uppercase">
        Case #{{ reporte.folio }}
      </span>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Estado del animal -->
      <div class="bg-white rounded-xl border border-outline-variant/40 shadow-sm p-6">
        <h2 class="text-lg font-bold mb-5">Estado del animal</h2>

        <label class="block text-xs font-bold mb-2">Estado general:</label>
        <select
          [(ngModel)]="reporte.estadoAnimal"
          class="w-full h-11 rounded-lg border border-outline-variant bg-surface px-3 text-sm mb-5">
          
          @for (estado of estadosDisponibles; track estado) {
            <option [value]="estado">{{ estado }}</option>
          }
          
        </select>

        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-bold">Nivel de urgencia:</label>
          <span class="{{ obtenerColorUrgencia() }} text-xs font-bold">
            {{ obtenerTextoUrgencia() | uppercase }}
          </span>
        </div>

        <input
  type="range"
  min="0"
  max="100"
  [value]="obtenerBarraUrgencia()"
  disabled
  class="w-full mb-6">

        <p class="text-xs font-bold mb-3">Condiciones observadas:</p>

        <div class="space-y-3">
          <label class="flex items-center justify-between text-sm">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-error"></span>
              Herido
            </span>
            <input type="checkbox" [(ngModel)]="reporte.condiciones.herido">
          </label>

          <label class="flex items-center justify-between text-sm">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span>
              Deshidratado
            </span>
            <input type="checkbox" [(ngModel)]="reporte.condiciones.deshidratado">
          </label>

          <label class="flex items-center justify-between text-sm">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
              Asustado / Agresivo
            </span>
            <input type="checkbox" [(ngModel)]="reporte.condiciones.asustado">
          </label>
        </div>
      </div>

      <!-- Notas -->
      <div class="bg-white rounded-xl border border-outline-variant/40 shadow-sm p-6">
        <h2 class="text-lg font-bold mb-5">Notas de salud</h2>

        <label class="block text-xs font-bold mb-2">Observaciones:</label>
        <textarea
          [(ngModel)]="reporte.observaciones"
          rows="6"
          class="w-full rounded-lg border border-outline-variant bg-surface p-3 text-sm resize-none"
          placeholder="Añadir observaciones sobre heridas, comportamiento, medicación...">
        </textarea>

        <div class="grid grid-cols-2 gap-3 mt-5">
          <div>
            <label class="block text-xs font-bold mb-2">Edad Est. (Años):</label>
            <input
              [(ngModel)]="reporte.edadEstimada"
              class="w-full h-11 rounded-lg border border-outline-variant bg-surface px-3 text-sm"
              placeholder="Ej. 3">
          </div>

          <div>
            <label class="block text-xs font-bold mb-2">Peso Est. (kg):</label>
            <input
              [(ngModel)]="reporte.pesoEstimado"
              class="w-full h-11 rounded-lg border border-outline-variant bg-surface px-3 text-sm"
              placeholder="Ej. 15">
          </div>
        </div>
      </div>

      <!-- Evidencia -->
      <div class="bg-white rounded-xl border border-outline-variant/40 shadow-sm p-6">
        <h2 class="text-lg font-bold mb-5">Entorno y evidencia</h2>

        <label class="block text-xs font-bold mb-2">Tipo de ubicación:</label>
        <input
          [(ngModel)]="reporte.tipoUbicacion"
          class="w-full h-11 rounded-lg border border-outline-variant bg-primary-container/60 px-3 text-sm mb-4">

        <label class="block text-xs font-bold mb-2">Dirección / GPS:</label>
        <input
          [(ngModel)]="reporte.direccion"
          class="w-full h-11 rounded-lg border border-outline-variant bg-primary-container/60 px-3 text-sm mb-4">

        <label class="block text-xs font-bold mb-2">Añadir evidencia (Foto/Video):</label>
        <button
          type="button"
          class="w-full h-28 border-2 border-dashed border-outline-variant rounded-lg text-sm text-on-surface-variant hover:border-primary hover:text-primary transition-colors">
          Toca para subir o arrastra un archivo
        </button>
      </div>

    </section>

    <section class="flex justify-center gap-4 mt-10">
      <button class="px-8 py-3 rounded-lg border border-outline text-on-surface font-semibold">
        Ver historial
      </button>

      <button
        (click)="enviar()"
        class="px-10 py-3 rounded-lg bg-primary text-white font-bold shadow-sm hover:bg-[#004799] transition-colors">
        ENVIAR ACTUALIZACIÓN
      </button>
    </section>

  </main>

  <app-footer-web></app-footer-web>

</div>
</ion-content>
