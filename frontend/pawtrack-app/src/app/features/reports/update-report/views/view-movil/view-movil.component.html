<div class="min-h-[100dvh] bg-[#f7f9ff] text-[#001b3d] overflow-x-hidden">

  <app-header-movil
    [titulo]="'Actualizar Detalles del Caso'"
    [mostrarRegresar]="true"
    [mostrarNotificaciones]="false">
  </app-header-movil>

  <main class="px-4 pt-24 pb-10 flex flex-col gap-5">

    <!-- Encabezado -->
    <section class="mb-1">
      <h1 class="text-2xl font-bold text-[#001b3d] leading-tight">
        Actualizar Detalles del Caso
      </h1>

      <span class="inline-block mt-2 bg-primary-container text-primary px-3 py-1 rounded text-xs font-bold uppercase">
        Case #{{ reporte.folio }}
      </span>
    </section>

    <!-- Estado del animal -->
    <section class="bg-white text-[#001b3d] rounded-2xl border border-outline-variant/40 shadow-sm p-5">
      <h2 class="text-lg font-bold text-[#001b3d] mb-5">
        Estado del Animal
      </h2>

      <label class="block text-xs font-bold text-slate-700 mb-2">
        Estado General:
      </label>

      <select
        [(ngModel)]="reporte.estadoAnimal"
        class="w-full h-11 rounded-lg border border-outline-variant bg-white text-[#001b3d] px-3 text-sm mb-5">
        <option>En ruta a clínica</option>
        <option>En observación</option>
        <option>Rescatado</option>
        <option>Estable</option>
        <option>Crítico</option>
      </select>

      <!-- Urgencia calculada -->
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-bold text-slate-700">
          Nivel de Urgencia:
        </label>

        <span
          class="text-xs font-bold"
          [ngClass]="obtenerColorUrgencia()">
          {{ obtenerTextoUrgencia() }}
        </span>
      </div>

      <input
        type="range"
        min="0"
        max="100"
        [value]="calcularUrgencia()"
        disabled
        class="w-full mb-2">

      <p class="text-xs text-slate-600 mb-5">
        Urgencia calculada: {{ calcularUrgencia() }}%
      </p>

      <!-- Condiciones -->
      <p class="text-xs font-bold text-slate-700 mb-3">
        Condiciones Observadas:
      </p>

      <div class="flex flex-col gap-3">

        <label class="flex items-center justify-between bg-[#f7f9ff] rounded-xl px-4 py-3 text-sm text-slate-800">
          <span class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-error"></span>
            Herido
          </span>

          <input
            type="checkbox"
            [(ngModel)]="reporte.condiciones.herido">
        </label>

        <label class="flex items-center justify-between bg-[#f7f9ff] rounded-xl px-4 py-3 text-sm text-slate-800">
          <span class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span>
            Deshidratado
          </span>

          <input
            type="checkbox"
            [(ngModel)]="reporte.condiciones.deshidratado">
        </label>

        <label class="flex items-center justify-between bg-[#f7f9ff] rounded-xl px-4 py-3 text-sm text-slate-800">
          <span class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-700"></span>
            Asustado / Agresivo
          </span>

          <input
            type="checkbox"
            [(ngModel)]="reporte.condiciones.asustado">
        </label>

      </div>
    </section>

    <!-- Notas de salud -->
    <section class="bg-white text-[#001b3d] rounded-2xl border border-outline-variant/40 shadow-sm p-5">
      <h2 class="text-lg font-bold text-[#001b3d] mb-5">
        Notas de Salud
      </h2>

      <label class="block text-xs font-bold text-slate-700 mb-2">
        Observaciones:
      </label>

      <textarea
        [(ngModel)]="reporte.observaciones"
        rows="6"
        class="w-full rounded-lg border border-outline-variant bg-white text-[#001b3d] placeholder:text-slate-500 p-3 text-sm resize-none mb-5"
        placeholder="Añadir observaciones sobre heridas, comportamiento, medicación...">
      </textarea>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-2">
            Edad Est.
          </label>

          <input
            [(ngModel)]="reporte.edadEstimada"
            class="w-full h-11 rounded-lg border border-outline-variant bg-white text-[#001b3d] placeholder:text-slate-500 px-3 text-sm"
            placeholder="Ej. 3">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-2">
            Peso Est. kg
          </label>

          <input
            [(ngModel)]="reporte.pesoEstimado"
            class="w-full h-11 rounded-lg border border-outline-variant bg-white text-[#001b3d] placeholder:text-slate-500 px-3 text-sm"
            placeholder="Ej. 15">
        </div>
      </div>
    </section>

    <!-- Entorno y evidencia -->
    <section class="bg-white text-[#001b3d] rounded-2xl border border-outline-variant/40 shadow-sm p-5">
      <h2 class="text-lg font-bold text-[#001b3d] mb-5">
        Entorno & Evidencia
      </h2>

      <label class="block text-xs font-bold text-slate-700 mb-2">
        Tipo de Ubicación:
      </label>

      <input
        [(ngModel)]="reporte.tipoUbicacion"
        class="w-full h-11 rounded-lg border border-outline-variant bg-[#f7f9ff] text-[#001b3d] px-3 text-sm mb-4">

      <label class="block text-xs font-bold text-slate-700 mb-2">
        Dirección / GPS:
      </label>

      <input
        [(ngModel)]="reporte.direccion"
        class="w-full h-11 rounded-lg border border-outline-variant bg-[#f7f9ff] text-[#001b3d] px-3 text-sm mb-4">

      <label class="block text-xs font-bold text-slate-700 mb-2">
        Añadir Evidencia:
      </label>

      <button
        type="button"
        class="w-full h-28 border-2 border-dashed border-outline-variant rounded-xl text-sm text-slate-600 hover:border-primary hover:text-primary transition-colors">
        Toca para subir una foto o video
      </button>
    </section>

    <!-- Botones -->
    <section class="flex flex-col gap-3 mt-2">
      <button
        type="button"
        class="w-full h-12 rounded-full border border-outline text-[#001b3d] font-semibold bg-white">
        Ver Historial
      </button>

      <button
        type="button"
        (click)="enviar()"
        class="w-full h-12 rounded-full bg-primary text-white font-bold shadow-sm">
        Enviar actualización
      </button>
    </section>

  </main>

  <div class="pb-28">
    <app-footer-movil></app-footer-movil>
  </div>

  <app-navbar></app-navbar>

</div>
