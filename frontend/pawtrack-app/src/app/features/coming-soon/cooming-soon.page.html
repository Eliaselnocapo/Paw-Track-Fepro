<ion-content [fullscreen]="true">
  <div class="w-full min-h-screen bg-slate-100 flex flex-col">

    <app-navbar-web></app-navbar-web>

    <main class="flex-1 w-full max-w-lg mx-auto px-6 py-16 flex flex-col items-center text-center">

      <div class="w-20 h-20 rounded-full bg-blue-100 text-blue-600 grid place-items-center mb-6">
        <span class="material-symbols-outlined text-[40px]">construction</span>
      </div>

      <p class="text-xs font-bold uppercase tracking-widest text-blue-600 mb-2">
        En construcción
      </p>

      <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-3">
        {{ titulo }} no está disponible todavía
      </h1>

      <p class="text-sm text-slate-500 leading-relaxed mb-8">
        {{ mensaje }}
      </p>

      <a
        [routerLink]="rutaVolver"
        class="h-11 px-6 bg-blue-700 text-white font-bold text-sm rounded-xl hover:bg-blue-800 transition-colors flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined text-[18px]">home</span>
        Volver al inicio
      </a>

    </main>

    <footer class="hidden md:block w-full bg-white mt-auto border-t border-slate-200">
      <app-footer-web></app-footer-web>
    </footer>

  </div>
</ion-content>
