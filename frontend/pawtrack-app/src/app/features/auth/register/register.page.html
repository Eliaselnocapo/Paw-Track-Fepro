<div class="w-full h-full">
<div class="w-full min-h-screen bg-slate-50 relative font-body overflow-x-hidden">

  <header class="w-full h-16 flex items-center justify-between px-8 z-50 absolute top-0 left-0">
    <div class="text-2xl font-bold text-blue-700 flex items-center gap-2 cursor-pointer" routerLink="/home">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
      PawTrack
    </div>

    <a routerLink="/home" class="text-blue-700 hover:text-blue-900 transition-colors font-bold flex items-center gap-1 cursor-pointer">
      <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      Volver al inicio
    </a>
  </header>

  <div class="absolute top-[-10%] left-[-5%] w-[500px] h-[500px] bg-blue-300 rounded-full mix-blend-multiply filter blur-[128px] opacity-60 pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[600px] h-[600px] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[128px] opacity-50 pointer-events-none"></div>

  <div class="relative z-10 w-full min-h-screen px-6 pt-24 pb-10 flex justify-center items-center">

    <div class="w-full max-w-[1000px] bg-white flex flex-col md:flex-row shadow-2xl rounded-3xl border border-slate-200 overflow-hidden">
      
      <div class="hidden md:block md:w-5/12 relative bg-slate-800">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-700/40 to-slate-900/80 mix-blend-multiply z-10"></div>

        <img 
          alt="Perritos felices" 
          class="absolute inset-0 w-full h-full object-cover z-0" 
          src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?q=80&w=800&auto=format&fit=crop"
        />

        <div class="absolute bottom-0 left-0 p-8 w-full z-20">
          <h2 class="text-2xl font-bold text-white mb-2">Únete a la Red de Rescate</h2>
          <p class="text-sm text-white/90">Tus acciones de hoy pueden salvar una vida mañana.</p>
        </div>
      </div>

      <div class="w-full md:w-7/12 p-7 md:p-10 flex flex-col justify-center bg-white">
        <div class="mb-6">
          <h1 class="text-3xl font-bold text-slate-900 mb-2">Crear Cuenta</h1>
          <p class="text-sm text-slate-600">Regístrate para unirte a la red de PawTrack.</p>
        </div>

        <form class="space-y-5">
          <div class="space-y-3">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">
              ¿Cómo te gustaría ayudar?
            </label>

            <div class="grid grid-cols-1 gap-3">
              <div class="relative">
                <input class="peer sr-only" id="role-reportant" name="role" type="radio" checked/>

                <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer transition-all hover:bg-slate-50 peer-checked:border-blue-600 peer-checked:bg-blue-50/50" for="role-reportant">
                  <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-red-500 mr-4 shadow-sm border border-slate-100">
                    <span class="material-symbols-outlined">campaign</span>
                  </div>

                  <div class="flex-grow">
                    <div class="font-bold text-slate-900 text-sm">Reportante</div>
                    <div class="text-slate-500 text-xs">Quiero reportar animales necesitados</div>
                  </div>

                  <span class="material-symbols-outlined text-blue-600 opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
                </label>
              </div>

              <div class="relative">
                <input class="peer sr-only" id="role-volunteer" name="role" type="radio"/>

                <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer transition-all hover:bg-slate-50 peer-checked:border-blue-600 peer-checked:bg-blue-50/50" for="role-volunteer">
                  <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-blue-600 mr-4 shadow-sm border border-slate-100">
                    <span class="material-symbols-outlined">volunteer_activism</span>
                  </div>

                  <div class="flex-grow">
                    <div class="font-bold text-slate-900 text-sm">Voluntario</div>
                    <div class="text-slate-500 text-xs">Quiero ayudar físicamente en los rescates</div>
                  </div>

                  <span class="material-symbols-outlined text-blue-600 opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
                </label>
              </div>
            </div>
          </div>

          <div class="space-y-4 pt-2">
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-slate-500 text-[20px]">person</span>
              </div>

              <input class="block w-full pl-10 pr-4 h-11 border border-slate-400 rounded-lg bg-white text-slate-800 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-sm outline-none shadow-sm placeholder-slate-400" id="fullName" name="fullName" placeholder="Nombre Completo" required type="text"/>
            </div>

            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-slate-500 text-[20px]">mail</span>
              </div>

              <input class="block w-full pl-10 pr-4 h-11 border border-slate-400 rounded-lg bg-white text-slate-800 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-sm outline-none shadow-sm placeholder-slate-400" id="email" name="email" placeholder="Correo Electrónico" required type="email"/>
            </div>

            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-slate-500 text-[20px]">lock</span>
              </div>

              <input class="block w-full pl-10 pr-4 h-11 border border-slate-400 rounded-lg bg-white text-slate-800 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-sm outline-none shadow-sm placeholder-slate-400" id="password" name="password" placeholder="Contraseña" required type="password"/>
            </div>
          </div>

          <div class="flex items-start pt-1">
            <div class="flex items-center h-5">
              <input class="h-4 w-4 text-blue-600 focus:ring-blue-600 border-slate-400 rounded bg-white cursor-pointer" id="terms" name="terms" required type="checkbox"/>
            </div>

            <div class="ml-2 text-xs text-slate-600">
              <label for="terms" class="cursor-pointer select-none">
                Acepto los 
                <a class="text-blue-700 hover:underline font-bold" href="#">Términos de Servicio</a> 
                y la 
                <a class="text-blue-700 hover:underline font-bold" href="#">Política de Privacidad</a>.
              </label>
            </div>
          </div>

          <div class="pt-1">
            <button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-md text-white bg-blue-700 hover:bg-blue-800 font-bold text-sm h-12 transition-all active:scale-[0.98]" type="button">
              Crear Cuenta
            </button>
          </div>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-slate-600">
            ¿Ya tienes una cuenta? 
            <a routerLink="/login" class="font-bold text-blue-700 hover:text-blue-900 hover:underline transition-colors cursor-pointer">
              Inicia Sesión
            </a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
</div>
